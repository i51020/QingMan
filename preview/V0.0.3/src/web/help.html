<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QingMan</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/help.css">
</head>
<body class="help-page">
  <div id="helpApp">

    <header id="helpTopbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-mark" data-i18n="app.nameZh"></span>
        <span class="brand-sub" data-i18n="app.nameEn"></span>
        <span class="brand-sub" data-i18n="help.titleTag"></span>
      </div>
      <div class="topbar-right">
        <span class="chip" id="helpChipVersion">—</span>
        <a class="btn btn-ghost" id="btnBack" href="./index.html" data-i18n="help.back"></a>
      </div>
    </header>

    <main id="helpMain">
      <aside id="helpNav">
        <h2 class="panel-title" data-i18n="help.navTitle"></h2>
        <ul class="help-nav-list" id="helpNavList"></ul>
      </aside>

      <article id="helpBody">
        <p class="help-lead" data-i18n="help.lead"></p>
        <div id="helpSections"></div>
      </article>
    </main>

    <footer id="helpFooter">
      <span data-i18n="help.footer"></span>
    </footer>
  </div>

  <script type="module" src="./js/help.js"></script>

</html>
