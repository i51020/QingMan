name: gate

# 青蔓 QingMan · 交付门禁（与本地 `py -3 tools/gate.py` 同一套判据）
#
# 为什么是 windows-latest：本项目**只支持 Windows**（start.bat / PowerShell / WScript.Shell
# / 桌面快捷方式 / 本地目录选择器），在 ubuntu 上跑不出真实结论，只会给出假绿或假红。
#
# 为什么把四件套拆成四个 step：合在 `gate.py` 里跑时，失败只报「四件套门禁 = failure」，
# 从日志外看不出是哪一环（2026-10-24 排查时被迫逐次删减来试）。拆开后**步骤名即结论**。
# 顺序与 gate.py 一致：verify → unittest → smoke → browser_smoke → manifest。
#
# 为什么不跑 handoff：`tools/handoff.py` 会改写 docs/接续说明.md（产物会被丢弃），
# 且其实况段含本机路径。实况段由本地提交前的 gate 负责刷新并一并提交。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          # **必须带全历史与标签**：`verify.py` 的「接续说明实况段 / 版本 tag 行」要用 tag。
          # checkout 默认只取单个提交且不取标签 ⇒ 实况段比对与 tag 断言都会假红。
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 交付校验 verify
        run: python tools/verify.py .

      - name: 单元测试 unittest
        shell: pwsh
        run: |
          # 把失败用例名同时写成 **GitHub 注解**：Actions 的原始日志需要登录才能读，
          # 而注解可经 `check-runs/{id}/annotations` 匿名读取 —— 排障时省一轮往返。
          $out = python -m unittest discover -s tests 2>&1 | Out-String
          Write-Host $out
          $bad = ($out -split "`n") | Where-Object { $_ -match '^(FAIL|ERROR):\s' }
          foreach ($line in $bad) { Write-Host "::error::$($line.Trim())" }
          if ($bad) { exit 1 }

      - name: 端到端冒烟 smoke
        run: python tools/smoke.py

      - name: 页面冒烟 browser_smoke
        run: python tools/browser_smoke.py

      - name: 两层清单 manifest
        run: python tools/manifest.py check
